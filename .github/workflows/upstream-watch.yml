# Upstream watch (docs/UPSTREAM_SYNC.md): once a day, compares this fork's main with upstream rac-rs (AsobiCodes/rac-rs). When
# upstream has commits main lacks, one issue labelled upstream-sync says which, and which files a merge would conflict in; it is
# kept up to date and closed once main has all of upstream. It needs no disc and changes no code: the merge itself is
# tools/upstream_sync.ps1 on a PC with the game set up.
name: Upstream watch

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compare with upstream
        id: cmp
        run: |
          git remote add upstream https://github.com/AsobiCodes/rac-rs.git
          git fetch --quiet --no-tags upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          [ "$behind" -gt 0 ] || exit 0
          up_ver=$(git show upstream/main:VERSION | tr -d '\r\n')
          echo "up_ver=$up_ver" >> "$GITHUB_OUTPUT"
          # The files a merge would conflict in (git merge-tree, no worktree); the bookkeeping files are resolved by the sync script.
          set +e
          git merge-tree --write-tree --name-only --no-messages HEAD upstream/main > merge.txt
          set -e
          book='^(VERSION|CHANGELOG\.md|Cargo\.lock|release_files\.txt|README\.md)$'
          {
            echo "Upstream rac-rs has **$behind** commit(s) this fork's \`main\` does not have yet. Upstream is at **v$up_ver**, this fork at **v$(tr -d '\r\n' < VERSION)**."
            echo
            echo "### Upstream commits"
            git log --format='- [`%h`](https://github.com/AsobiCodes/rac-rs/commit/%H) %ad %s' --date=short HEAD..upstream/main
            echo
            echo "### Predicted conflicts"
            tail -n +2 merge.txt | grep -v '^$' > conflicts.txt || true
            if [ -s conflicts.txt ]; then
              grep -Ev "$book" conflicts.txt | sed 's/^/- `/; s/$/` (by hand)/' || true
              grep -E "$book" conflicts.txt | sed 's/^/- `/; s/$/` (resolved by rule)/' || true
            else
              echo "None: the merge is clean."
            fi
            gen=$(git diff --name-only HEAD upstream/main -- tools/recgen_iso.py tools/share_iso.py tools/vugen_iso.py tools/fn_bounds.tsv tools/fn_bounds_usa.tsv oracle/stubs.txt)
            if [ -n "$gen" ]; then
              echo
              echo "The game-code generators changed ($(echo $gen | tr ' ' ',')): the sync generates the game code again, and players' updates rebuild the whole game."
            fi
            echo
            echo "### To sync"
            echo
            echo "On the PC with the game set up (docs/UPSTREAM_SYNC.md):"
            echo
            echo '```'
            echo 'powershell -ExecutionPolicy Bypass -File tools\upstream_sync.ps1 -Push'
            echo '```'
            echo
            echo "_Updated by the Upstream watch workflow, $(date -u '+%Y-%m-%d %H:%M UTC')._"
          } > body.md

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.cmp.outputs.behind }}
          UP_VER: ${{ steps.cmp.outputs.up_ver }}
        run: |
          gh label create upstream-sync --color 1D76DB --description 'Upstream rac-rs has commits main lacks' --force >/dev/null
          num=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ "$BEHIND" -eq 0 ]; then
            [ -z "$num" ] || gh issue close "$num" --comment 'main has everything of upstream rac-rs now.'
            exit 0
          fi
          title="Upstream rac-rs v$UP_VER is out: sync this fork"
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "$title" --body-file body.md
          else
            gh issue create --title "$title" --label upstream-sync --body-file body.md
          fi
